<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine Vision Camera</title>
<style>
:root{color-scheme:light dark;--bg:#faf7fb;--fg:#222;--control:#fff;--border:#777;--accent:#6750a4}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f5f5f5;--control:#242424;--border:#aaa;--accent:#d0bcff}}
*{box-sizing:border-box}body{font:16px sans-serif;margin:16px;background:var(--bg);color:var(--fg)}main{max-width:720px;margin:auto}#preview{width:100%;height:55vh;background:#000;object-fit:contain;border:1px solid var(--border)}section{display:grid;grid-template-columns:110px 1fr 90px 28px 64px;gap:8px;align-items:center;margin:8px 0}input[type=range]{width:100%;accent-color:var(--accent)}input[type=number],select,button{background:var(--control);color:var(--fg);border:1px solid var(--border);border-radius:4px}input[type=number]{width:80px;padding:6px}.buttons{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}button{padding:10px 16px}#status{min-height:24px}
</style>
<main><h2>Machine Vision Camera</h2><div id="status">Connecting…</div><div class="buttons"><select id="camera"></select><button onclick="control('scan_hidden').then(refresh)">Search hidden lenses</button><select id="previewConfig"><option value="">Auto resolution · 30 FPS</option></select><button onclick="applyPreviewConfig()">Apply preview</button></div><img id="preview" src="/mjpeg"><div class="buttons"><button onclick="control('set_camera',{cameraId:camera.value})">Select camera</button><button onclick="control('camera_power',{enabled:true})">Camera ON</button><button onclick="control('camera_power',{enabled:false})">Camera OFF</button><button onclick="control('capture')">📷 Take photo</button></div><div id="controls"></div></main>
<script>
const defs=[['ISO','iso',50,3200,'ISO','set_iso','iso'],['Exposure','exposure_us',100,1000000,'us','set_exposure_us','exposure'],['Focus D','focusDiopter',0,10,'D','set_focus','focus'],['Zoom','zoom',0.6,10,'x','set_zoom',null],['White balance','temperatureK',2000,8000,'K','set_temperature_k','white_balance']];
const root=document.querySelector('#controls'); const rows={};
defs.forEach(([label,key,min,max,unit,type,parameter])=>{const row=document.createElement('section');row.innerHTML=`<label>${label}</label><input type="range" min="${min}" max="${max}" step="any"><input type="number" min="${min}" max="${max}"><span>${unit}</span>${parameter?`<label><input type="checkbox" checked>Auto</label>`:''}`;const s=row.children[1],n=row.children[2],a=parameter?row.children[4].firstElementChild:null;const apply=()=>{let v=Math.max(min,Math.min(max,Number(n.value)));n.value=v;s.value=v;control(type,{value:v})};s.oninput=()=>{n.value=s.value;control(type,{value:Number(s.value)})};n.onkeydown=e=>{if(e.key==='Enter'){apply();n.blur()}};n.onchange=apply;if(a)a.onchange=()=>control('set_auto',{parameter,enabled:a.checked});root.append(row);rows[key]={s,n,a}});
async function control(type,extra={}){const r=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:1,requestId:String(Date.now()),type,...extra})});const j=await r.json();if(!j.ok)document.querySelector('#status').textContent=j.error||'Command failed'}
function applyPreviewConfig(){if(!previewConfig.value){control('set_preview_config',{fps:30});return}const [width,height]=previewConfig.value.split(',').map(Number);control('set_preview_config',{width,height,quality:45,fps:30})}
async function refresh(){const r=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:1,requestId:String(Date.now()),type:'get_state'})});const j=await r.json();if(j.ok){camera.innerHTML='';[...(j.cameraIds||[]),...(j.hiddenIds||[])].forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent='Camera '+id;camera.append(o)});camera.value=j.cameraId||'';previewConfig.innerHTML='';(j.previewSizes||[]).forEach(size=>{const [w,h]=size.split('×');const o=document.createElement('option');o.value=`${w},${h}`;o.textContent=`${size} · 30 FPS`;previewConfig.append(o)});previewConfig.value=`${j.previewWidth},${j.previewHeight}`;if(rows.iso.a)rows.iso.a.checked=j.autoIso!==false;if(rows.exposure_us.a)rows.exposure_us.a.checked=j.autoExposure!==false;if(rows.focusDiopter.a)rows.focusDiopter.a.checked=j.autoFocus!==false;if(rows.temperatureK.a)rows.temperatureK.a.checked=j.autoWhiteBalance!==false}}
const events=new EventSource('/events');events.onopen=()=>status.textContent='Connected';events.onerror=()=>status.textContent='Connection lost';events.onmessage=e=>{const j=JSON.parse(e.data);if(j.event==='photo'){const a=document.createElement('a');a.href='data:image/jpeg;base64,'+j.data;a.download='MVC_'+new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')+'.jpg';a.click();status.textContent='Photo downloaded by browser'}};
refresh();
</script>
